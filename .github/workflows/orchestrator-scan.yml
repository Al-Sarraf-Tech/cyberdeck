name: Orchestrator Scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  orchestrator:
    uses: Al-Sarraf-Tech/Haskell-Orchestrator/.github/workflows/orchestrator-scan.yml@d5c460b8e498beb59cb5c476964dc9d05ba84980
    with:
      fail-on: error
